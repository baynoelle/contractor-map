<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contractor Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">CM</div>
      <div><h1>Contractor Map</h1><p><span id="mappedCount">0</span> of <span id="totalCount">0</span> locations mapped</p></div>
    </div>
    <label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">Search contractors</span><input id="search" type="search" autocomplete="off" placeholder="Search company, contact, city, state…"></label>
    <div id="status" class="status">Preparing contractor locations…</div>
    <div id="list" class="list"></div>
  </aside>
  <main>
    <div id="map" aria-label="Interactive contractor location map"></div>
    <section id="servicePanel" class="service-panel" aria-live="polite" hidden></section>
    <button id="fitBtn" class="fit-btn" type="button">Fit all pins</button>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="contractors.js"></script>
  <script src="app.js"></script>
</body>
</html>
